<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#4F46E5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background decorative floating blobs -->
  <circle cx="300" cy="250" r="190" fill="url(#bgGrad)" opacity="0.8"/>
  <circle cx="100" cy="110" r="45" fill="#FEF3C7" opacity="0.6"/>
  <circle cx="510" cy="380" r="55" fill="#CFFAFE" opacity="0.6"/>
  <circle cx="490" cy="100" r="30" fill="#FCE7F3" opacity="0.7"/>

  <!-- Floating playful elements -->
  <!-- Star 1 -->
  <path d="M120 70 L123 78 L132 80 L125 86 L127 94 L120 90 L113 94 L115 86 L108 80 L117 78 Z" fill="#F59E0B" />
  <!-- Star 2 -->
  <path d="M470 70 L472 76 L478 78 L474 83 L475 89 L470 86 L465 89 L466 83 L462 78 L468 76 Z" fill="#F59E0B" />
  <!-- Sparkles -->
  <circle cx="170" cy="180" r="4" fill="#06B6D4" />
  <circle cx="450" cy="200" r="6" fill="#6366F1" />
  <circle cx="130" cy="340" r="5" fill="#EC4899" />

  <!-- Center Card: Digital Learning Worksheet Preview -->
  <g filter="url(#softShadow)" transform="translate(140, 110)">
    <rect x="0" y="0" width="320" height="260" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    
    <!-- Card Header / Browser bar -->
    <rect x="0" y="0" width="320" height="42" rx="20" fill="#F8FAFC"/>
    <rect x="0" y="22" width="320" height="20" fill="#F8FAFC"/>
    <line x1="0" y1="42" x2="320" y2="42" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <circle cx="22" cy="21" r="5" fill="#EF4444"/>
    <circle cx="36" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="50" cy="21" r="5" fill="#10B981"/>
    
    <!-- Title placeholder -->
    <rect x="80" y="14" width="160" height="14" rx="7" fill="#E2E8F0"/>

    <!-- Worksheet Content Simulation -->
    <rect x="30" y="65" width="180" height="16" rx="4" fill="#4F46E5" opacity="0.9"/>
    <rect x="30" y="92" width="260" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="30" y="108" width="220" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="30" y="124" width="240" height="8" rx="4" fill="#E2E8F0"/>

    <!-- Mini Exercise Boxes -->
    <rect x="30" y="150" width="120" height="70" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="45" y="175" font-family="sans-serif" font-weight="bold" font-size="12" fill="#15803D">1. Etkinlik</text>
    <rect x="45" y="188" width="85" height="6" rx="3" fill="#86EFAC"/>
    <rect x="45" y="200" width="60" height="6" rx="3" fill="#BBF7D0"/>

    <rect x="170" y="150" width="120" height="70" rx="10" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="185" y="175" font-family="sans-serif" font-weight="bold" font-size="12" fill="#1D4ED8">2. Etkinlik</text>
    <rect x="185" y="188" width="85" height="6" rx="3" fill="#93C5FD"/>
    <rect x="185" y="200" width="70" height="6" rx="3" fill="#BFDBFE"/>
  </g>

  <!-- Left Floating Badge: 100% MEB Uyumlu -->
  <g filter="url(#softShadow)" transform="translate(60, 260)">
    <rect x="0" y="0" width="150" height="64" rx="16" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="2"/>
    <circle cx="32" cy="32" r="18" fill="#10B981" />
    <path d="M26 32 L30 36 L38 28" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="28" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0F172A">MEB Müfredatı</text>
    <text x="58" y="44" font-family="sans-serif" font-size="11" fill="#10B981" font-weight="600">%100 Birebir Uyum</text>
  </g>

  <!-- Right Floating Badge: Kolay PDF İndir -->
  <g filter="url(#softShadow)" transform="translate(410, 240)">
    <rect x="0" y="0" width="150" height="64" rx="16" fill="#FFFFFF" stroke="#FFE4E6" stroke-width="2"/>
    <circle cx="32" cy="32" r="18" fill="#F43F5E" />
    <path d="M26 30 L32 36 L38 30 M32 23 L32 35 M24 40 L40 40" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="58" y="28" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0F172A">Ücretsiz PDF</text>
    <text x="58" y="44" font-family="sans-serif" font-size="11" fill="#F43F5E" font-weight="600">Tek Tıkla Yazdır</text>
  </g>

  <!-- Bottom Stack of Books & Pencil -->
  <g transform="translate(240, 385)">
    <!-- Book 1 (Blue) -->
    <rect x="0" y="26" width="140" height="22" rx="5" fill="url(#purpleGrad)"/>
    <rect x="10" y="28" width="125" height="18" rx="3" fill="#FFFFFF" opacity="0.3"/>
    
    <!-- Book 2 (Cyan) -->
    <rect x="15" y="8" width="120" height="20" rx="5" fill="url(#cyanGrad)"/>
    <rect x="25" y="10" width="105" height="16" rx="3" fill="#FFFFFF" opacity="0.3"/>
    
    <!-- Book 3 (Yellow) -->
    <rect x="30" y="-8" width="95" height="18" rx="5" fill="url(#yellowGrad)"/>

    <!-- Apple on top of books -->
    <circle cx="85" cy="-20" r="11" fill="#EF4444"/>
    <path d="M85 -31 C83 -27, 85 -24, 85 -21" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M85 -28 Q92 -32 94 -26 Q88 -26 85 -28" fill="#10B981"/>
  </g>
</svg>