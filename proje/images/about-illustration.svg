<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="abGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Background Shape -->
  <rect x="20" y="20" width="460" height="360" rx="30" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Teacher Blackboard Concept -->
  <rect x="60" y="50" width="380" height="200" rx="16" fill="#1E293B"/>
  <rect x="70" y="60" width="360" height="180" rx="10" fill="#0F172A"/>
  
  <!-- Chalk drawings on board -->
  <text x="95" y="105" font-family="'Outfit', sans-serif" font-weight="bold" font-size="20" fill="#38BDF8">A + B = Başarı ⭐</text>
  <text x="95" y="145" font-family="sans-serif" font-size="14" fill="#94A3B8">✓ MEB Müfredatına Uygun Etkinlikler</text>
  <text x="95" y="175" font-family="sans-serif" font-size="14" fill="#94A3B8">✓ Eğlenceli ve Özgün Çalışma Kâğıtları</text>
  <text x="95" y="205" font-family="sans-serif" font-size="14" fill="#94A3B8">✓ %100 Ücretsiz Eğitim Desteği</text>

  <!-- Interactive Pillars below -->
  <g transform="translate(60, 275)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="115" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#FEF3C7"/>
    <text x="28" y="34" font-family="sans-serif" font-size="14" text-anchor="middle">🎯</text>
    <text x="50" y="32" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0F172A">Misyonumuz</text>
    <text x="14" y="60" font-family="sans-serif" font-size="10" fill="#64748B">Eşit & Nitelikli Eğitim</text>

    <!-- Card 2 -->
    <rect x="132" y="0" width="115" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="160" cy="28" r="14" fill="#EDE9FE"/>
    <text x="160" y="34" font-family="sans-serif" font-size="14" text-anchor="middle">💡</text>
    <text x="182" y="32" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0F172A">Vizyonumuz</text>
    <text x="146" y="60" font-family="sans-serif" font-size="10" fill="#64748B">Yaratıcı Nesiller</text>

    <!-- Card 3 -->
    <rect x="264" y="0" width="115" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="292" cy="28" r="14" fill="#DCFCE7"/>
    <text x="292" y="34" font-family="sans-serif" font-size="14" text-anchor="middle">🌱</text>
    <text x="314" y="32" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0F172A">Gelişim</text>
    <text x="278" y="60" font-family="sans-serif" font-size="10" fill="#64748B">Öğrenci Odaklı</text>
  </g>
</svg>