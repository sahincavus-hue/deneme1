<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>
  <!-- Logo Icon: Open Book with Magic Rocket / Star -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#logoGrad)" />
    <!-- Book pages -->
    <path d="M12 34 C 18 31, 22 31, 24 35 C 26 31, 30 31, 36 34 L 36 18 C 30 15, 26 15, 24 19 C 22 15, 18 15, 12 18 Z" fill="#FFFFFF" opacity="0.95" />
    <line x1="24" y1="19" x2="24" y2="35" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
    <!-- Pencil / Sparkle -->
    <circle cx="34" cy="14" r="5" fill="url(#accentGrad)" />
    <path d="M34 11 L35 13 L37 14 L35 15 L34 17 L33 15 L31 14 L33 13 Z" fill="#FFFFFF" />
  </g>
  <!-- Text Brand -->
  <text x="64" y="32" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="22" fill="#0F172A">
    İlkokul<tspan fill="#4F46E5">Atölyesi</tspan>
  </text>
  <text x="65" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#64748B" letter-spacing="1.2">
    ÖZGÜN EĞİTİM MATERYALLERİ
  </text>
</svg>